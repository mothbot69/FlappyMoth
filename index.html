<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@mothalamp">
<meta name="twitter:title" content="Moth Flap">
<meta name="twitter:description" content="Tap to play. Flap the moth, dodge the lights.">

<meta property="og:title" content="Moth Flap">
<meta property="og:description" content="Tap to play. Flap the moth, dodge the lights.">
<meta property="og:image" content="https://flappymothct.app/preview.jpg">
<meta property="og:url" content="https://flappymothct.app/">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moth Flap</title> content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moth Flap</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a0c18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#0a0c18;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:8px;box-shadow:0 0 40px rgba(255,200,100,.12)}
</style></head><body>
<canvas id="c" width="360" height="600"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=360,H=600,FLOOR=H-14,GAP=118,MR=10,F='Georgia,"Times New Roman",serif';
let best=0;try{best=+localStorage.getItem('mothbest')||0}catch(e){}
function fit(){const s=Math.min(innerWidth/W,(innerHeight-(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0))/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const stars=[...Array(45)].map(()=>({x:Math.random()*W,y:Math.random()*FLOOR,r:Math.random()*1.3+.3,s:Math.random()*.3+.1}));
let state='ready',m,obs,score,t=0,dead=0,last=0;
function reset(){m={x:90,y:H/2,vy:0,rot:0};obs=[];score=0;dead=0}
reset();
function flap(){
  if(state==='ready'){state='play';reset();m.vy=-6.6}
  else if(state==='play'){m.vy=-6.6}
  else if(state==='over'&&performance.now()-dead>450){state='ready';reset()}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();flap()}});
function spawn(){const top=55+Math.random()*(FLOOR-GAP-110);obs.push({x:W+40,top,bot:top+GAP,done:false})}
function circRect(cx,cy,r,rx,ry,rw,rh){const nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));return (cx-nx)**2+(cy-ny)**2<r*r}
function hit(o){
  const bcy=o.top-24;
  if(circRect(m.x,m.y,MR,o.x-5,0,10,bcy-12))return true;           // cord + socket
  if(circRect(m.x,m.y,MR,o.x-20,bcy-20,40,40)&&Math.hypot(m.x-o.x,m.y-bcy)<20+MR)return true; // bulb
  if(circRect(m.x,m.y,MR,o.x-27,o.bot,54,40))return true;          // shade
  if(circRect(m.x,m.y,MR,o.x-4,o.bot+40,8,FLOOR))return true;      // pole
  return false;
}
function die(){state='over';dead=performance.now();if(score>best){best=score;try{localStorage.setItem('mothbest',best)}catch(e){}}}
function update(dt){
  t+=dt;
  stars.forEach(s=>{s.x-=s.s*dt;if(s.x<0)s.x=W});
  if(state==='ready'){m.y=H/2+Math.sin(t*.07)*12;m.rot=0;return}
  if(state!=='play')return;
  m.vy=Math.min(m.vy+.42*dt,9);m.y+=m.vy*dt;m.rot=Math.max(-.5,Math.min(.9,m.vy*.07));
  if(m.y<MR){m.y=MR;m.vy=0}
  if(m.y>FLOOR-MR){m.y=FLOOR-MR;die();return}
  const sp=2.9+Math.min(score*.08,2.2);
  obs.forEach(o=>{o.x-=sp*dt;if(!o.done&&o.x<m.x){o.done=true;score++}});
  if(!obs.length||obs[obs.length-1].x<W-185)spawn();
  obs=obs.filter(o=>o.x>-60);
  if(obs.some(hit))die();
}
function glow(x,y,r,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(255,214,120,${a})`);gr.addColorStop(1,'rgba(255,214,120,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function drawObs(o){
  const bcy=o.top-24;
  g.globalCompositeOperation='lighter';glow(o.x,bcy,95,.45);glow(o.x,o.bot-6,80,.35);g.globalCompositeOperation='source-over';
  // hanging bulb
  g.strokeStyle='#2a2d3f';g.lineWidth=3;g.beginPath();g.moveTo(o.x,0);g.lineTo(o.x,bcy-32);g.stroke();
  g.fillStyle='#3a3d52';g.fillRect(o.x-7,bcy-34,14,16);
  g.fillStyle='#ffe9a8';g.beginPath();g.arc(o.x,bcy,20,0,7);g.fill();
  g.fillStyle='#fff8dc';g.beginPath();g.arc(o.x-5,bcy-5,8,0,7);g.fill();
  // floor lamp
  g.fillStyle='#2a2d3f';g.fillRect(o.x-4,o.bot+40,8,FLOOR-o.bot-40);
  g.beginPath();g.ellipse(o.x,FLOOR,24,6,0,0,7);g.fill();
  g.fillStyle='#ffd877';g.beginPath();g.moveTo(o.x-17,o.bot);g.lineTo(o.x+17,o.bot);g.lineTo(o.x+30,o.bot+40);g.lineTo(o.x-30,o.bot+40);g.fill();
  g.fillStyle='#fff2c0';g.beginPath();g.ellipse(o.x,o.bot,17,4,0,0,7);g.fill();
}
function drawMoth(){
  g.save();g.translate(m.x,m.y);g.rotate(m.rot);
  const f=state==='over'?0:Math.sin(t*(m.vy<0?.9:.5))*.7;
  g.fillStyle='#9aa0ad';
  [-1,1].forEach(()=>0);
  g.save();g.rotate(-.5+f*.8);g.beginPath();g.ellipse(-4,-10,7,14,-.3,0,7);g.fill();g.restore();   // back wing
  g.fillStyle='#b9beca';
  g.save();g.rotate(.3-f*.6);g.beginPath();g.ellipse(-9,-2,14,8,.2,0,7);g.fill();g.restore();      // front wing
  g.fillStyle='#6c7280';g.beginPath();g.ellipse(2,2,9,5.5,0,0,7);g.fill();                          // body
  g.beginPath();g.arc(10,0,4,0,7);g.fill();
  g.strokeStyle='#8b91a0';g.lineWidth=1.3;g.beginPath();g.moveTo(12,-2);g.quadraticCurveTo(18,-9,22,-8);g.moveTo(12,-1);g.quadraticCurveTo(19,-5,23,-3);g.stroke();
  g.fillStyle='#fff';g.fillRect(11,-1.5,1.6,1.6);
  g.restore();
}
function txt(s,x,y,sz,col='#fff3cf',a='center'){g.font=`${sz}px ${F}`;g.textAlign=a;g.fillStyle=col;g.fillText(s,x,y)}
function draw(){
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#070914');bg.addColorStop(1,'#1b1a33');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle='#cfd6ff';stars.forEach(s=>{g.globalAlpha=.4+.3*Math.sin(t*.03+s.x);g.fillRect(s.x,s.y,s.r,s.r)});g.globalAlpha=1;
  obs.forEach(drawObs);
  g.fillStyle='#14142a';g.fillRect(0,FLOOR,W,H-FLOOR);
  drawMoth();
  if(state==='play')txt(score,W/2,70,48);
  if(state==='ready'){
    txt('Moth Flap',W/2,170,46);
    txt('tap, click or press space to flutter',W/2,205,16,'#c9c2a8');
    txt('stay out of the lamps',W/2,230,16,'#c9c2a8');
    if(best)txt('best '+best,W/2,H-50,18,'#c9c2a8');
  }
  if(state==='over'){
    g.fillStyle='rgba(5,6,16,.62)';g.fillRect(0,0,W,H);
    txt('Too close to the light',W/2,215,30);
    txt(score,W/2,290,64,'#ffd877');
    txt('best '+best,W/2,325,20,'#c9c2a8');
    txt('tap to try again',W/2,390,18);
  }
}
function loop(ts){const dt=Math.min((ts-(last||ts))/16.667,2.5);last=ts;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
