<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moth Flap</title>
<style>
html,body{height:100%;margin:0;background:#0a0c18;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="360" height="600"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=360,H=600,FLOOR=H-14,GAP=118,MR=10,F='Georgia,"Times New Roman",serif';
let best=0;try{best=+localStorage.getItem('mothbest')||0}catch(e){}
function fit(){const s=Math.min(innerWidth/W,(innerHeight-(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0))/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const stars=[...Array(45)].map(()=>({x:Math.random()*W,y:Math.random()*FLOOR,r:Math.random()*1.3+.3,s:Math.random()*.3+.1}));
let state='ready',m,obs,score,t=0,dead=0,last=0;
function reset(){m={x:90,y:H/2,vy:0,rot:0};obs=[];score=0;dead=0}
reset();
function flap(){
  if(state==='ready'){state='play';reset();m.vy=-6.6}
  else if(state==='play'){m.vy=-6.6}
  else if(state==='over'&&performance.now()-dead>450){state='ready';reset()}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();flap()}});
function spawn(){const top=55+Math.random()*(FLOOR-GAP-110);obs.push({x:W+40,top,bot:top+GAP,done:false})}
function circRect(cx,cy,r,rx,ry,rw,rh){const nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));return (cx-nx)**2+(cy-ny)**2<r*r}
function hit(o){
  const bcy=o.top-24;
  if(circRect(m.x,m.y,MR,o.x-5,0,10,bcy-12))return true;
  if(circRect(m.x,m.y,MR,o.x-20,bcy-20,40,40)&&Math.hypot(m.x-o.x,m.y-bcy)<20+MR)return true;
  if(circRect(m.x,m.y,MR,o.x-27,o.bot,54,40))return true;
  if(circRect(m.x,m.y,MR,o.x-4,o.bot+40,8,FLOOR))return true;
  return false;
}
function die(){state='over';dead=performance.now();if(score>best){best=score;try{localStorage.setItem('mothbest',best)}catch(e){}}}
function update(dt){
  t+=dt;
  stars.forEach(s=>{s.x-=s.s*dt;if(s.x<0)s.x=W});
  if(state==='ready'){m.y=H/2+Math.sin(t*.07)*12;m.rot=0;return}
  if(state!=='play')return;
  m.vy=Math.min(m.vy+.42*dt,9);m.y+=m.vy*dt;m.rot=Math.max(-.5,Math.min(.9,m.vy*.07));
  if(m.y<MR){m.y=MR;m.vy=0}
  if(m.y>FLOOR-MR){m.y=FLOOR-MR;die();return}
  const sp=2.9+Math.min(score*.08,2.2);
  obs.forEach(o=>{o.x-=sp*dt;if(!o.done&&o.x<m.x){o.done=true;score++}});
  if(!obs.length||obs[obs.length-1].x<W-185)spawn();
  obs=obs.filter(o=>o.x>-60);
  if(obs.some(hit))die();
}
function glow(x,y,r,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(255,214,120,${a})`);gr.addColorStop(1,'rgba(255,214,120,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function drawObs(o){
  const bcy=o.top-24;
